  flag_hide_prices_desc: Masque les prix aux visiteurs non connectés (B2B strict). Requiert PS_B2B_ENABLE.
  flag_catalog_mode_desc: 'Mode vitrine pur : masque boutons panier + ajout produit (catalogue consultable uniquement). Utile pour lancement sans e-commerce.'
  section_price_title: Prix
  section_price_subtitle: Affichage et arrondi des prix de la boutique.
  flag_price_round_up_title: Arrondir le prix affiché
  flag_price_round_up_desc: 'Si activé, le prix affiché est arrondi à l''euro supérieur (ex. 47,99 € → 48 €), comme sur PrestaShop. L''arrondi est effectif partout : catalogue, fiche produit, panier et facture.'
  section_order_title: Commande
  section_order_subtitle: Comportement du checkout et après-vente.
  flag_guest_checkout_desc: Autorise la commande sans création de compte (checkout invité).
  flag_order_return_desc: Autorise les retours de marchandise (client peut créer un RMA depuis mon compte).
  flag_purchase_minimum_desc: Minimum de commande en € HT. Bloque le checkout (panier direct ET magic-link devis sauf override ci-dessous) sous ce seuil, et affiché sur le devis PDF + BO. 0 = pas de minimum (feature désactivée).
  flag_magiclink_under_min_desc: Autorise quand même l'envoi du bouton « Valider le devis » dans l'email accusé, même quand le total est sous le minimum. Par défaut désactivé pour préserver le contrôle commercial.
  section_pwa_title: Application (PWA)
  section_pwa_subtitle: Le site peut être installé comme une application sur le téléphone ou le bureau du visiteur (icône sur l'écran d'accueil, ouverture plein écran).
  flag_pwa_install_banner_desc: Affiche une bannière discrète invitant le visiteur à installer l'application (en bas à droite). Ne s'affiche que sur les navigateurs compatibles. Désactive pour masquer complètement l'invitation.
  section_marketplace_compare_title: Comparaison marketplace (aperçu employé)
  section_marketplace_compare_subtitle: Affiche l'ancienne et la nouvelle description côte à côte sur les fiches produit, visible uniquement par vous (employé connecté).
