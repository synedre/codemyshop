  flag_marketplace_mode_desc: 'Quand activé, un panneau « Aperçu employé » apparaît sur les fiches produit publiques pour comparer la description d''origine (fournisseur) et la description réécrite. Invisible pour les visiteurs et les clients : seuls les employés connectés le voient.'
